name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_VOSK_MODEL_ZH_URL: "https://795c0233a37a8c69cb92a550fbdb419f.r2.cloudflarestorage.com/stroke-trainer-vosk-models/models/vosk-model-small-zh-tw-0.3.tar.gz"
          VITE_VOSK_MODEL_EN_URL: "https://795c0233a37a8c69cb92a550fbdb419f.r2.cloudflarestorage.com/stroke-trainer-vosk-models/models/vosk-model-small-en-us-0.15.tar.gz"
          VITE_VOSK_MODEL_ZH_VOCAB_URL: "https://795c0233a37a8c69cb92a550fbdb419f.r2.cloudflarestorage.com/stroke-trainer-vosk-models/models/vosk-model-small-zh-tw-0.3-vocabulary.txt"
          VITE_VOSK_MODEL_EN_VOCAB_URL: "https://795c0233a37a8c69cb92a550fbdb419f.r2.cloudflarestorage.com/stroke-trainer-vosk-models/models/vosk-model-small-en-us-0.15-vocabulary.txt"
          VITE_VOSK_MODEL_MIN_BYTES: "34603008"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
